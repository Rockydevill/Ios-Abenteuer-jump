<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#06141b"><title>Public test | Games Behind Doors</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/home-redesign.css"><link rel="stylesheet" href="/accessibility.css"><style>
:root{--gbd-bg:#06141b;--gbd-panel:#0b202a;--gbd-line:#274753;--gbd-text:#eef7fa;--gbd-muted:#a9bec6;--gbd-accent:#9fe3ff;--gbd-ok:#173d29;--gbd-bad:#4a2227}body{background:var(--gbd-bg);color:var(--gbd-text)}.gbd-nav{position:sticky;top:0;z-index:10;display:flex;gap:18px;align-items:center;padding:14px 5vw;background:rgba(6,20,27,.96);border-bottom:1px solid var(--gbd-line);backdrop-filter:blur(12px)}.gbd-brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}.gbd-brand span:last-child{display:flex;flex-direction:column}.gbd-brand small{color:var(--gbd-muted)}.gbd-nav nav{display:flex;gap:14px;flex:1;flex-wrap:wrap}.gbd-nav nav a,.gbd-lang{color:#cfe8ef;text-decoration:none;padding:8px;border-radius:8px}.gbd-nav nav a[aria-current=page],.gbd-nav nav a:hover{background:#12313d}.gbd-main{max-width:1180px;margin:auto;padding:28px 20px 64px}.gbd-test-banner{display:flex;gap:14px;align-items:flex-start;padding:13px 5vw;background:#4a3915;color:#fff5ce;border-bottom:1px solid #7d6422}.gbd-test-banner span{max-width:1000px}.gbd-hero{padding:44px 0}.gbd-hero h1{font-size:clamp(2rem,6vw,4rem);max-width:900px}.gbd-actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.gbd-grid{display:grid;gap:18px}.gbd-grid.two{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.gbd-grid.three{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.gbd-card,.gbd-game-card{background:var(--gbd-panel);border:1px solid var(--gbd-line);border-radius:16px;padding:18px}.gbd-card label{display:block;margin:12px 0}.gbd-card input,.gbd-card select,.gbd-card textarea,.gbd-filters input,.gbd-filters select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--gbd-line);background:#041016;color:var(--gbd-text);font:inherit}.gbd-card textarea{min-height:120px}.gbd-filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0;align-items:end}.gbd-check{display:flex!important;gap:8px;align-items:center}.gbd-check input{width:auto!important}.gbd-games{display:grid;gap:14px}.gbd-game-link{display:grid;grid-template-columns:110px 1fr;gap:16px;color:inherit;text-decoration:none}.gbd-cover{height:90px;border-radius:12px;background:#102e39;display:grid;place-items:center;overflow:hidden}.gbd-cover.large{height:240px}.gbd-cover img{width:100%;height:100%;object-fit:cover}.gbd-detail{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:24px}.gbd-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.gbd-pill{font-size:.78rem;padding:5px 8px;border:1px solid var(--gbd-line);border-radius:999px}.gbd-meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.gbd-meta span{background:#102a35;padding:6px 9px;border-radius:999px;font-size:.9rem}.gbd-msg{padding:12px;border-radius:10px;margin:10px 0}.gbd-msg.success{background:var(--gbd-ok)}.gbd-msg.error,.gbd-error{background:var(--gbd-bad);padding:14px;border-radius:10px}.gbd-empty,.gbd-loading{padding:24px;text-align:center;color:var(--gbd-muted)}.gbd-comments article,.gbd-msgline{border-top:1px solid var(--gbd-line);padding:12px 0}.gbd-inline{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.gbd-inline select{width:auto}.link-button{background:none;border:0;color:var(--gbd-accent);padding:0;cursor:pointer}.gbd-ticket,.gbd-mini-game{display:grid;grid-template-columns:auto 1fr auto;gap:10px;width:100%;padding:10px;margin:7px 0;border:1px solid var(--gbd-line);border-radius:10px;background:#081a22;color:inherit;text-decoration:none;text-align:left}.gbd-footer{border-top:1px solid var(--gbd-line);padding:30px 5vw 50px}.gbd-footer nav{display:flex;gap:12px 18px;flex-wrap:wrap;margin-top:12px}.gbd-footer a{color:#bedce6}.gbd-faq details{background:var(--gbd-panel);border:1px solid var(--gbd-line);padding:14px;border-radius:12px;margin:10px 0}.gbd-faq summary{cursor:pointer;font-weight:800}.button.danger{background:#ffb8b8;color:#3b0808}@media(max-width:720px){.gbd-nav{align-items:flex-start;flex-wrap:wrap}.gbd-n
